<body class="auth-page">

<div class="container">
<a aria-label="Web Design Agency početna" class="navbar-brand d-flex align-items-center gap-2" href="index.html">
<span class="logo-mark"><span></span></span>
<span>Web Design Agency</span>
</a>
<button aria-controls="navbarNav" aria-expanded="false" aria-label="Otvori navigaciju" class="navbar-toggler" data-bs-target="#navbarNav" data-bs-toggle="collapse" type="button">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav mx-auto mb-2 mb-lg-0">
<li class="nav-item">
<a class="nav-link" href="index.html">Početna</a>
</li>
<li class="nav-item">

<li class="nav-item">

</li>
</ul>
<a class="btn btn-cinematic rounded-pill px-4 site-auth-button" href="auth.html">
            Login / Register
            <span aria-hidden="true">→</span>
</a>
</div>
</div>
</nav><div class="auth-scene">
<div class="auth-bg"></div>
<div class="auth-overlay"></div>
<div class="auth-particles"></div>
<main class="auth-wrapper">
<section class="auth-card liquid-glass" id="authCard">
<a class="auth-back" href="index.html">← Nazad na sajt</a>
<div class="auth-head">
<span class="auth-eyebrow">
<span class="dot"></span>
              Klijentski portal
            </span>
<h1 id="authTitle">
              Pristupite svom <em>korisničkom nalogu.</em>
</h1>
<p id="authSubtitle">
              Prijavite se da pratite projekte, dostavite materijale i komunicirate sa timom agencije.
            </p>
</div>
<div class="auth-switcher">
<button class="switch-btn active" id="loginTab" type="button">Prijava</button>
<button class="switch-btn" id="registerTab" type="button">Registracija</button>
</div>
<form class="auth-form active" id="loginForm" novalidate="">
<div class="form-group">
<label for="loginEmail">Email adresa</label>
<input autocomplete="email" class="form-control" id="loginEmail" name="email" placeholder="unesi email" required="" type="email"/>
</div>
<div class="form-group">
<label for="loginPassword">Lozinka</label>
<input autocomplete="current-password" class="form-control" id="loginPassword" name="password" placeholder="unesi lozinku" required="" type="password"/>
</div>
<div class="auth-row">
<label class="remember-check">
<input id="loginRemember" type="checkbox"/>
<span>Zapamti me</span>
</label>
<a class="auth-link" href="#" id="forgotPasswordLink">Zaboravljena lozinka?</a>
</div>
<button class="btn btn-cinematic w-100 rounded-pill auth-submit" id="loginSubmit" type="submit">
              Prijavi se
            </button>
<div aria-live="polite" class="auth-status" id="loginStatus" role="status"></div>
</form>
<form class="auth-form" id="registerForm" novalidate="">
<div class="form-group">
<label for="registerName">Ime i prezime</label>
<input autocomplete="name" class="form-control" id="registerName" maxlength="80" minlength="2" name="name" placeholder="unesi ime i prezime" required="" type="text"/>
</div>
<div class="form-group">
<label for="registerEmail">Email adresa</label>
<input autocomplete="email" class="form-control" id="registerEmail" name="email" placeholder="unesi email" required="" type="email"/>
</div>
<div class="form-group">
<label for="registerPassword">Lozinka</label>
<input autocomplete="new-password" class="form-control" id="registerPassword" minlength="8" name="password" placeholder="najmanje 8 karaktera, slovo i broj" required="" type="password"/>
</div>
<div class="form-group">
<label for="registerConfirmPassword">Potvrdi lozinku</label>
<input autocomplete="new-password" class="form-control" id="registerConfirmPassword" minlength="8" name="confirmPassword" placeholder="ponovi lozinku" required="" type="password"/>
</div>
<div class="auth-row auth-row-register">
<label class="remember-check">
<input id="registerTerms" required="" type="checkbox"/>
<span>Prihvatam uslove korišćenja</span>
</label>
</div>
<button class="btn btn-cinematic w-100 rounded-pill auth-submit" id="registerSubmit" type="submit">
              Kreiraj nalog
            </button>
<div aria-live="polite" class="auth-status" id="registerStatus" role="status"></div>
</form>
<div class="auth-footer-text" id="authFooterText">
            Nemate nalog?
            <button class="text-switch" data-auth-switch="register" type="button">
              Registruj se
            </button>
</div>
</section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/auth.js?v=9"></script>
<script src="js/unified-navbar.js?v=1"></script></body>
</html>
