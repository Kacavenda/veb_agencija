<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register — Cinematic Agency</title>
    <meta
      name="description"
      content="Prijava i registracija za Cinematic Agency platformu."
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth-style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-scene">
      <div class="auth-bg"></div>
      <div class="auth-overlay"></div>
      <div class="auth-particles"></div>

      <main class="auth-wrapper">
        <section class="auth-card liquid-glass" id="authCard">
          <a href="index.html" class="auth-back">← Nazad na sajt</a>

          <div class="auth-head">
            <span class="auth-eyebrow">
              <span class="dot"></span>
              Cinematic Access
            </span>

            <h1 id="authTitle">
              Dobrodošao nazad u <em>svoj prostor.</em>
            </h1>

            <p id="authSubtitle">
              Prijavi se da nastaviš pregled projekta, dokumenata i daljih koraka.
            </p>
          </div>

          <div class="auth-switcher">
            <button class="switch-btn active" id="loginTab" type="button">Login</button>
            <button class="switch-btn" id="registerTab" type="button">Register</button>
          </div>

          <form class="auth-form active" id="loginForm">
            <div class="form-group">
              <label for="loginEmail">Email adresa</label>
              <input
                type="email"
                id="loginEmail"
                class="form-control"
                placeholder="unesi email"
                required
              />
            </div>

            <div class="form-group">
              <label for="loginPassword">Lozinka</label>
              <input
                type="password"
                id="loginPassword"
                class="form-control"
                placeholder="unesi lozinku"
                required
              />
            </div>

            <div class="auth-row">
              <label class="remember-check">
                <input type="checkbox" />
                <span>Zapamti me</span>
              </label>

              <a href="#" class="auth-link">Zaboravljena lozinka?</a>
            </div>

            <button type="submit" class="btn btn-cinematic w-100 rounded-pill auth-submit">
              Prijavi se
            </button>
          </form>

          <form class="auth-form" id="registerForm">
            <div class="form-group">
              <label for="registerName">Ime i prezime</label>
              <input
                type="text"
                id="registerName"
                class="form-control"
                placeholder="unesi ime i prezime"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerEmail">Email adresa</label>
              <input
                type="email"
                id="registerEmail"
                class="form-control"
                placeholder="unesi email"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerPassword">Lozinka</label>
              <input
                type="password"
                id="registerPassword"
                class="form-control"
                placeholder="kreiraj lozinku"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerConfirmPassword">Potvrdi lozinku</label>
              <input
                type="password"
                id="registerConfirmPassword"
                class="form-control"
                placeholder="ponovi lozinku"
                required
              />
            </div>

            <div class="auth-row auth-row-register">
              <label class="remember-check">
                <input type="checkbox" required />
                <span>Prihvatam uslove korišćenja</span>
              </label>
            </div>

            <button type="submit" class="btn btn-cinematic w-100 rounded-pill auth-submit">
              Kreiraj nalog
            </button>
          </form>

          <div class="auth-footer-text" id="authFooterText">
            Nemaš nalog?
            <button type="button" class="text-switch" id="goRegister">Registruj se</button>
          </div>
        </section>
      </main>
    </div>

    <script>
      const loginTab = document.getElementById("loginTab");
      const registerTab = document.getElementById("registerTab");
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const authTitle = document.getElementById("authTitle");
      const authSubtitle = document.getElementById("authSubtitle");
      const authFooterText = document.getElementById("authFooterText");
      const goRegister = document.getElementById("goRegister");
      const authCard = document.getElementById("authCard");

      function showLogin() {
        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        loginForm.classList.add("active");
        registerForm.classList.remove("active");

        authCard.classList.remove("register-mode");

        authTitle.innerHTML = 'Dobrodošao nazad u <em>svoj prostor.</em>';
        authSubtitle.textContent =
          "Prijavi se da nastaviš pregled projekta, dokumenata i daljih koraka.";

        authFooterText.innerHTML =
          'Nemaš nalog? <button type="button" class="text-switch" id="goRegisterNew">Registruj se</button>';

        document
          .getElementById("goRegisterNew")
          .addEventListener("click", showRegister);
      }

      function showRegister() {
        registerTab.classList.add("active");
        loginTab.classList.remove("active");

        registerForm.classList.add("active");
        loginForm.classList.remove("active");

        authCard.classList.add("register-mode");

        authTitle.innerHTML = 'Kreiraj nalog za <em>novi početak.</em>';
        authSubtitle.textContent =
          "Registruj se i otvori pristup svom dashboard-u, projektima i komunikaciji.";

        authFooterText.innerHTML =
          'Već imaš nalog? <button type="button" class="text-switch" id="goLoginNew">Prijavi se</button>';

        document.getElementById("goLoginNew").addEventListener("click", showLogin);
      }

      loginTab.addEventListener("click", showLogin);
      registerTab.addEventListener("click", showRegister);
      goRegister.addEventListener("click", showRegister);

      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        alert("Login forma je spremna za povezivanje sa backend-om.");
      });

      registerForm.addEventListener("submit", function (e) {
        e.preventDefault();
        alert("Register forma je spremna za povezivanje sa backend-om.");
      });
    </script>
  </body>
</html>
